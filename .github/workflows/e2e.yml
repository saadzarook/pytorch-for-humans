# Builds the site and runs the Playwright browser tests (site/tests/e2e) in
# headless Chromium: sim behaviour, narration snapshot, Pyodide cells, quiz,
# offline-after-load, and phone layout in light + dark mode.
name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build the site
        run: npm run build

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
        working-directory: site

      # The Pyodide checks download Pyodide from its CDN, so this job needs internet access.
      - name: Run browser tests
        run: npm run test:e2e

      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
